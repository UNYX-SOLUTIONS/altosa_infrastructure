services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: altosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - altosa_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: altosa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - altosa_backend
    # Solo red interna: el acceso público va SIEMPRE por Traefik
    # (HTTPS en dbglobal.altosamobiliario.com y respaldo http://IP:5050).
    # NO publicar el puerto 80 directo (expondría pgAdmin sin cifrado).
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=altosa_backend"
      # Acceso por dominio con HTTPS (ej. https://dbglobal.altosamobiliario.com)
      - "traefik.http.routers.altosa-pgadmin-web.rule=Host(`${PGADMIN_PUBLIC_DOMAIN:-dbglobal.altosamobiliario.com}`)"
      - "traefik.http.routers.altosa-pgadmin-web.entrypoints=websecure"
      - "traefik.http.routers.altosa-pgadmin-web.tls=true"
      - "traefik.http.routers.altosa-pgadmin-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.altosa-pgadmin-web.service=altosa-pgadmin"
      # Acceso directo por IP usando el entrypoint dedicado (http://IP:5050)
      - "traefik.http.routers.altosa-pgadmin.rule=PathPrefix(`/`)"
      - "traefik.http.routers.altosa-pgadmin.entrypoints=pgadmin"
      - "traefik.http.services.altosa-pgadmin.loadbalancer.server.port=80"
    depends_on:
      postgres:
        condition: service_healthy

  # API interna de solo lectura/CRUD sobre la base de datos del cliente.
  # NO publica puertos: solo es alcanzable desde la red altosa_backend
  # (backend del ERP Unyx, n8n, etc.). La ruta pública /uploads (imágenes de
  # variantes) se expone vía Traefik sobre el dominio del ERP de pruebas.
  api:
    build:
      context: ./backend
    image: altosa-api:latest
    container_name: altosa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@altosa-postgres:5432/${POSTGRES_DB}?schema=public
      API_KEY: ${ALTOSA_API_KEY:?Define ALTOSA_API_KEY en .env}
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL_BASE: ${ALTOSA_PUBLIC_URL_BASE:?Define ALTOSA_PUBLIC_URL_BASE en .env}
      KOMMO_API_URL: ${KOMMO_API_URL:-}
      KOMMO_API_KEY: ${KOMMO_API_KEY:-}
      META_CATALOG_ID: ${META_CATALOG_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - altosa_backend
    # Solo red interna: el acceso público va por Traefik (HTTPS).
    expose:
      - "4100"
    labels:
      - "traefik.enable=true"
      # Traefik (host-mode) alcanza la IP del contenedor en su red bridge.
      - "traefik.docker.network=altosa_backend"
      # API + imágenes bajo el subdominio del cliente (HTTPS).
      # El ERP Unyx (otro VPS) consume /api/v1 con x-api-key; /uploads es público.
      - "traefik.http.routers.altosa-api.rule=Host(`${ALTOSA_PUBLIC_DOMAIN:-api.altosamobiliario.com}`)"
      - "traefik.http.routers.altosa-api.entrypoints=websecure"
      - "traefik.http.routers.altosa-api.tls=true"
      - "traefik.http.routers.altosa-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.altosa-api.priority=300"
      - "traefik.http.routers.altosa-api.middlewares=altosa-api-ratelimit"
      - "traefik.http.routers.altosa-api.service=altosa-api"
      - "traefik.http.middlewares.altosa-api-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.altosa-api-ratelimit.ratelimit.burst=100"
      - "traefik.http.services.altosa-api.loadbalancer.server.port=4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  altosa_backend:
    external: true
    name: altosa_backend

volumes:
  postgres_data:
    name: altosa_postgres_data
  pgadmin_data:
    name: altosa_pgadmin_data
  uploads_data:
    name: altosa_uploads_data
