services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: altosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - altosa_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: altosa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - altosa_backend
    # A random host port is allocated. Traefik discovers it through Docker,
    # just like the Hostinger n8n deployment.
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.altosa-pgadmin.rule=PathPrefix(`/`)"
      - "traefik.http.routers.altosa-pgadmin.entrypoints=pgadmin"
      - "traefik.http.services.altosa-pgadmin.loadbalancer.server.port=80"
    depends_on:
      postgres:
        condition: service_healthy

  # API interna de solo lectura/CRUD sobre la base de datos del cliente.
  # NO publica puertos: solo es alcanzable desde la red altosa_backend
  # (backend del ERP Unyx, n8n, etc.). La ruta pública /uploads (imágenes de
  # variantes) se expone vía Traefik sobre el dominio del ERP de pruebas.
  api:
    build:
      context: ./backend
    image: altosa-api:latest
    container_name: altosa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@altosa-postgres:5432/${POSTGRES_DB}?schema=public
      API_KEY: ${ALTOSA_API_KEY:?Define ALTOSA_API_KEY en .env}
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL_BASE: ${ALTOSA_PUBLIC_URL_BASE:?Define ALTOSA_PUBLIC_URL_BASE en .env}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - altosa_backend
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-unyx-workspace-front}"
      - "traefik.http.routers.altosa-files.rule=Host(`${ALTOSA_PUBLIC_DOMAIN:-altosa-test.erp.unyxsolutions.com}`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.altosa-files.entrypoints=websecure"
      - "traefik.http.routers.altosa-files.tls=true"
      - "traefik.http.routers.altosa-files.tls.certresolver=letsencrypt"
      - "traefik.http.routers.altosa-files.priority=200"
      - "traefik.http.routers.altosa-files.middlewares=altosa-files-ratelimit"
      - "traefik.http.middlewares.altosa-files-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.altosa-files-ratelimit.ratelimit.burst=200"
      - "traefik.http.services.altosa-files.loadbalancer.server.port=4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  altosa_backend:
    external: true
    name: altosa_backend
  # Red donde vive Traefik (misma que usa el ERP de pruebas)
  traefik:
    name: ${TRAEFIK_NETWORK:-unyx-workspace-front}
    external: true

volumes:
  postgres_data:
    name: altosa_postgres_data
  pgadmin_data:
    name: altosa_pgadmin_data
  uploads_data:
    name: altosa_uploads_data
