services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: altosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - altosa_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: altosa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - altosa_backend
    # A random host port is allocated. Traefik discovers it through Docker,
    # just like the Hostinger n8n deployment.
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.altosa-pgadmin.rule=PathPrefix(`/`)"
      - "traefik.http.routers.altosa-pgadmin.entrypoints=pgadmin"
      - "traefik.http.services.altosa-pgadmin.loadbalancer.server.port=80"
    depends_on:
      postgres:
        condition: service_healthy

  # API interna de solo lectura sobre la base de datos del cliente.
  # NO publica puertos: solo es alcanzable desde la red altosa_backend
  # (backend del ERP Unyx, n8n, etc.).
  api:
    build:
      context: ./backend
    image: altosa-api:latest
    container_name: altosa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@altosa-postgres:5432/${POSTGRES_DB}?schema=public
      API_KEY: ${ALTOSA_API_KEY:?Define ALTOSA_API_KEY en .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - altosa_backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  altosa_backend:
    external: true
    name: altosa_backend

volumes:
  postgres_data:
    name: altosa_postgres_data
  pgadmin_data:
    name: altosa_pgadmin_data
