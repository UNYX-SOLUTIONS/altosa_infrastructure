services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: altosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - altosa_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: altosa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - altosa_backend
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.altosa-pgadmin.rule=Host(`${PGADMIN_HOST}`)"
      - "traefik.http.routers.altosa-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.altosa-pgadmin.tls=true"
      - "traefik.http.routers.altosa-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.altosa-pgadmin.loadbalancer.server.port=80"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  altosa_backend:
    external: true
    name: altosa_backend

volumes:
  postgres_data:
    name: altosa_postgres_data
  pgadmin_data:
    name: altosa_pgadmin_data
